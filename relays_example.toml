# =============================================================================
# DRLMS Relay Configuration Example
# =============================================================================
# 复制此文件到以下位置之一：
#   - Windows: %APPDATA%\ming-drlms\relays.toml
#   - Linux/WSL: ~/.config/ming-drlms/relays.toml
#   - 或通过 DRLMS_RELAYS_CONFIG 环境变量指定
# =============================================================================

# -----------------------------------------------------------------------------
# 发现设置 (Discovery)
# -----------------------------------------------------------------------------
[discovery]
# 启用 DNS TXT 记录发现
dns_enabled = true

# 启用 Well-Known 发现 (/.well-known/drlms-relays.json)
well_known_enabled = true

# 发现域名（用于 DNS/Well-Known 查询）
# domain = "example.com"

# -----------------------------------------------------------------------------
# 健康检查设置 (Health)
# -----------------------------------------------------------------------------
[health]
# 健康检查间隔（秒）
check_interval = 30.0

# Ping 超时（秒）
ping_timeout = 5.0

# 同步测试超时（秒）
sync_test_timeout = 10.0

# 最低健康分数阈值（低于此值视为不健康）
min_score = 0.3

# -----------------------------------------------------------------------------
# 离线队列设置 (Offline)
# -----------------------------------------------------------------------------
[offline]
# 最大重试次数
max_retries = 10

# 基础重试延迟（秒）
base_delay = 1.0

# 最大重试延迟（秒，指数退避上限）
max_delay = 300.0

# 队列最大容量
max_queue_size = 1000

# -----------------------------------------------------------------------------
# 回执验证设置 (Receipt) - Phase 17C XEdDSA Only
# -----------------------------------------------------------------------------
[receipt]
# 是否要求回执验证通过才算写入成功
require_verified = true

# 最少需要验证通过的回执数量
min_verified_count = 1

# 是否持久化回执元数据到本地数据库
persist_receipts = true

# 回执保留天数（0 = 永久保留）
retention_days = 30

# Phase 17C: XEdDSA only (HMAC removed)
# signature_scheme = "xeddsa"  # Only option now

# -----------------------------------------------------------------------------
# Phase 18B: Keyserver 设置
# -----------------------------------------------------------------------------
[keyserver]
# Keyserver 房间前缀（自动追加 relay_id）
room_prefix = "__keyserver__"

# 查询超时（秒）
timeout = 5.0

# PreKey Bundle 缓存路径（留空使用默认）
# cache_path = ""

# OPK 管理
min_opk_count = 10      # 最小 OPK 数量，低于此值触发补充
target_opk_count = 100  # 补充后的目标数量

# Bundle 过期时间（秒，默认 7 天）
bundle_ttl = 604800

# -----------------------------------------------------------------------------
# Relay 列表
# -----------------------------------------------------------------------------
# 优先级 (priority): 数字越小优先级越高
# enabled: 是否启用此 Relay
# backup_only: 仅作为备份（主 Relay 不可用时才使用）
# region: 区域标识（用于就近选择）

[[relays]]
url = "http://127.0.0.1:8081"
priority = 1
enabled = true
backup_only = false
region = "local"
# Phase 17A: Relay 公钥 (64 hex chars = 32 bytes Ed25519)
# 用于验证 XEdDSA 签名，可从 /health 或 /.well-known/drlms-relay.json 获取
# pubkey = "abc123def456..."

# 示例：添加更多 Relay
# [[relays]]
# url = "http://relay2.example.com:8081"
# priority = 2
# enabled = true
# backup_only = false
# region = "us-west"
# pubkey = "..."  # Phase 17A

# [[relays]]
# url = "http://relay3.example.com:8081"
# priority = 3
# enabled = true
# backup_only = true  # 仅作为备份
# region = "eu-central"
# pubkey = "..."  # Phase 17A

# =============================================================================
# 配置说明
# =============================================================================
# 
# 1. 发现机制优先级：
#    静态配置 > 本地缓存 > DNS TXT > Well-Known > Bootstrap
#
# 2. 健康评分规则：
#    - 成功请求增加分数，失败降低分数
#    - 延迟影响评分（低延迟 = 高分）
#    - 连续失败会快速降分
#
# 3. 并行写策略：
#    - 向所有健康 Relay 并行写入
#    - 至少一个成功即视为写入成功
#    - 失败的 Relay 会自动重试（通过离线队列）
#
# 4. 回执验证（Phase 17C: XEdDSA only）：
#    - 服务端返回 XEdDSA 签名的存储确认
#    - 客户端使用公钥验证签名确保写入可靠性
#    - 公钥通过 /health 或 /.well-known/drlms-relay.json 获取
#
# =============================================================================

# =============================================================================
# Phase 19: Relay Mode Complete
# =============================================================================
#
# Phase 19 启用完整 Relay 模式：
#
# 环境变量设置：
#   DRLMS_BACKEND_MODE=relay
#   DRLMS_DEFAULT_RELAYS=http://127.0.0.1:8081
#
# CLI 命令：
#   ming-drlms identity create --name "Alice"
#   ming-drlms chat send --to <pubkey> --message "hello"
#   ming-drlms chat recv --room <room_id>
#
# TUI 启动：
#   ming-drlms tui
#   （会自动检测 DRLMS_BACKEND_MODE=relay 进入 Relay 模式）
#
# =============================================================================
