# tools/cli/pyproject.toml

[build-system]
requires = ["setuptools>=61.0", "setuptools-scm>=7.1", "wheel>=0.38"]
build-backend = "setuptools.build_meta"

[project]
name = "ming-drlms"
dynamic = ["version"]
description = "CLI wrapper for DRLMS server/agent with pretty UX"
readme = "README.md"
authors = [{ name = "lgnorant-lu", email = "zhouzihan825@gmail.com" }]
# 依据 PEP 621 使用 SPDX 字符串并在同段声明许可证文件，兼容 setuptools 校验
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.9"
dependencies = [
    "typer[all]",
    "pyyaml",
    "rich",

    "argon2-cffi>=21.3,<24",
    "protobuf==6.33.1",
    "requests",
    "packaging>=24.2",
    "cffi>=1.15.0,<3.0",
    "cryptography>=42.0,<46",  # 保持 42.x-45.x 兼容范围
    "typing-extensions>=4.7.0",
    "textual>=6.6.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "zstandard>=0.25.0",  # New for Phase 23: Compression support
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",  # pytest 8.x 系列
    "pytest-cov",
    "pytest-asyncio>=0.23,<1",  # 0.23+ 支持 asyncio_mode="auto"
    "python-multipart",
    "nuitka>=2.0",
]

relay = [
    "fastapi>=0.115,<1",  # FastAPI 0.115+ (Pydantic v2 兼容)
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0,<3",  # Pydantic v2 系列
    "httpx>=0.27",
    "pynacl>=1.5.0",  # Phase 17A: XEdDSA signing
]

# 开发环境一次性安装所有依赖
all = [
    "ming-drlms[dev]",
    "ming-drlms[relay]",
]

[project.urls]
"Source" = "https://github.com/lgnorant-lu/ming-drlms"

[project.scripts]
ming-drlms = "ming_drlms.main:app"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["ming_drlms*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
"ming_drlms" = ["cli_help/*.md", "proto/schema/v2/*_pb2.py", "core/_pysignal_runtime.c"]

[tool.setuptools_scm]
write_to = "src/ming_drlms/_version.py"
fallback_version = "0.0.0"
version_scheme = "no-guess-dev"
local_scheme = "no-local-version"

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that exercise the external server binary",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
# 在所有检查中（lint, format等）排除以下文件和目录
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "build", 
    "dist", 
    "tools/cli/src/ming_drlms/_version.py",
    "src/ming_drlms/proto/schema/v2/*_pb2.py",  # Generated protobuf files
]
target-version = "py38"

[tool.deptry]
pep621_dev_dependency_groups = ["dev"]

[tool.deptry.per_rule_ignores]
DEP001 = ["tomllib"]
