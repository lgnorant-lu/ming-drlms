name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-packages:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libargon2-dev netcat-openbsd lcov clang-format cppcheck zip

      - name: Install Python tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install ".[gui]" build twine coverage pytest pyinstaller

      - name: Build native components
        run: |
          make clean
          make all

      - name: Stage native binaries for packaging
        run: |
          mkdir -p src/ming_drlms/bin
          cp -f log_collector_server log_agent log_consumer ipc_sender proc_launcher libipc.so src/ming_drlms/bin/ || true

      - name: Build Python distributions
        run: python -m build

      - name: Install build artifacts for smoke tests
        run: python -m pip install --force-reinstall dist/*.whl

      - name: Run coverage suite
        run: make coverage

      - name: Run file corruption regression test
        run: python tests/test_file_corruption_fix.py

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: ming-drlms-dist
          path: dist/*
          if-no-files-found: error

      - name: Upload coverage report (HTML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: coverage/html
          if-no-files-found: ignore

  publish-testpypi:
    runs-on: ubuntu-latest
    needs: build-packages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: ming-drlms-dist
          path: dist
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          verbose: true

  publish-pypi:
    runs-on: ubuntu-latest
    needs: build-packages
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: ming-drlms-dist
          path: dist
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  package-gui:
    runs-on: ubuntu-latest
    needs: build-packages
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: gui-${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'requirements-dev.txt') }}
          restore-keys: |
            gui-${{ runner.os }}-pip-

      - name: Install GUI packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libargon2-dev zip
          python -m pip install --upgrade pip
          python -m pip install ".[gui]" pyinstaller

      - name: Package GUI application
        run: python scripts/package_gui.py --clean --output dist/linux

      - name: Archive GUI bundle
        run: |
          cd dist
          zip -r DRLMS-GUI-linux.zip linux

      - name: Upload GUI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ming-drlms-gui
          path: |
            dist/linux
            dist/DRLMS-GUI-linux.zip

  create-release:
    runs-on: ubuntu-latest
    needs:
      - publish-pypi
      - package-gui
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download Python distributions
        uses: actions/download-artifact@v4
        with:
          name: ming-drlms-dist
          path: dist

      - name: Download GUI bundles
        uses: actions/download-artifact@v4
        with:
          name: ming-drlms-gui
          path: gui

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            gui/DRLMS-GUI-linux.zip
          generate_release_notes: true
