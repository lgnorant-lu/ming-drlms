name: macOS CI

on:
  push:
    branches:
      - main
      - feature/gui
  pull_request:

jobs:
  build-test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [host]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Homebrew dependencies
        run: |
          brew update
          brew install cmake argon2 openssl@3 sqlite3 lcov

      - name: Configure environment variables
        shell: bash
        run: |
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          ARGON2_PREFIX=$(brew --prefix argon2)
          echo "OPENSSL_ROOT_DIR=${OPENSSL_PREFIX}" >> "$GITHUB_ENV"

          NEW_LDFLAGS="-L${OPENSSL_PREFIX}/lib -L${ARGON2_PREFIX}/lib"
          if [[ -n "${LDFLAGS:-}" ]]; then
            NEW_LDFLAGS="${LDFLAGS} ${NEW_LDFLAGS}"
          fi
          echo "LDFLAGS=${NEW_LDFLAGS}" >> "$GITHUB_ENV"

          NEW_CPPFLAGS="-I${OPENSSL_PREFIX}/include -I${ARGON2_PREFIX}/include"
          if [[ -n "${CPPFLAGS:-}" ]]; then
            NEW_CPPFLAGS="${CPPFLAGS} ${NEW_CPPFLAGS}"
          fi
          echo "CPPFLAGS=${NEW_CPPFLAGS}" >> "$GITHUB_ENV"

          NEW_PKG="${OPENSSL_PREFIX}/lib/pkgconfig:${ARGON2_PREFIX}/lib/pkgconfig"
          if [[ -n "${PKG_CONFIG_PATH:-}" ]]; then
            NEW_PKG="${PKG_CONFIG_PATH}:${NEW_PKG}"
          fi
          echo "PKG_CONFIG_PATH=${NEW_PKG}" >> "$GITHUB_ENV"

      - name: Configure CMake
        run: |
          ARCHFLAG=""
          if [[ "${{ matrix.arch }}" == "host" ]]; then
            if [[ $(uname -m) == "arm64" ]]; then
              ARCHFLAG="-DCMAKE_OSX_ARCHITECTURES=arm64"
            else
              ARCHFLAG="-DCMAKE_OSX_ARCHITECTURES=x86_64"
            fi
          else
            ARCHFLAG="-DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }}"
          fi
          cmake -S . -B build -DENABLE_TESTS=ON -DENABLE_COVERAGE=ON -DOPENSSL_ROOT_DIR="$OPENSSL_ROOT_DIR" ${ARCHFLAG}

      - name: Build targets
        run: cmake --build build --parallel

      - name: Run C tests
        run: ctest --test-dir build --output-on-failure

      - name: Run coverage and integration suite
        run: bash scripts/run_coverage.sh

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-coverage
          path: coverage/
          if-no-files-found: ignore

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-logs
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
            build/Testing/Temporary/LastTest.log

  package-macos-gui:
    needs: [build-test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install GUI packaging dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[gui]" "flet>=0.28.3,<0.29.0" pyinstaller

      - name: Build macOS GUI app with Flet Pack
        run: |
          flet pack src/ming_drlms_gui/app.py \
            --name "DRLMS GUI" \
            --product-name "ming-drlms" \
            --description "A beautiful GUI client for ming-drlms" \
            --copyright "DRLMS Team" \
            --add-data "src/ming_drlms_gui/assets=assets" \
            --add-data "src/ming_drlms_gui/i18n=i18n"

      - name: Upload packaged GUI artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-gui-app
          path: dist/
          if-no-files-found: error

