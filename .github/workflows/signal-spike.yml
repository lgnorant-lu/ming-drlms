name: Signal Spike

on:
  push:
    branches: [ main, feature/** ]
  pull_request:
    branches: [ main ]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make gcc g++ libssl-dev
      - name: Configure
        run: cmake -S . -B build -DENABLE_SIGNAL_SPIKE=ON -DBUILD_SERVER=OFF
      - name: Build
        run: cmake --build build --target test_signal_spike -j2
      - name: Run
        run: |
          set -e
          ./build/test_signal_spike | tee spike.log
          status=${PIPESTATUS[0]}
          grep -Fq "Signal E2E Loop OK" spike.log
          grep_status=$?
          if [ "$status" -ne 0 ] || [ "$grep_status" -ne 0 ]; then
            echo "Spike run failed: status=$status grep=$grep_status" >&2
            exit 1
          fi

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: |
          brew update
          brew install cmake openssl@3
      - name: Configure
        env:
          OPENSSL_ROOT_DIR: /usr/local/opt/openssl@3
        run: cmake -S . -B build -DENABLE_SIGNAL_SPIKE=ON -DBUILD_SERVER=OFF
      - name: Build
        run: cmake --build build --target test_signal_spike -j2
      - name: Run
        run: |
          set -e
          ./build/test_signal_spike | tee spike.log
          status=${PIPESTATUS[0]}
          grep -Fq "Signal E2E Loop OK" spike.log
          grep_status=$?
          if [ "$status" -ne 0 ] || [ "$grep_status" -ne 0 ]; then
            echo "Spike run failed: status=$status grep=$grep_status" >&2
            exit 1
          fi

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up MSVC developer command prompt
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Configure vcpkg root
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $customRoot = Join-Path $Env:RUNNER_TEMP 'vcpkg'
          Add-Content -Path $Env:GITHUB_ENV -Value "VCPKG_ROOT=$customRoot"
          Add-Content -Path $Env:GITHUB_ENV -Value ("CMAKE_TOOLCHAIN_FILE={0}" -f (Join-Path $customRoot 'scripts/buildsystems/vcpkg.cmake'))
          Add-Content -Path $Env:GITHUB_ENV -Value "VCPKG_TARGET_TRIPLET=x64-windows"
      - name: Restore vcpkg cache
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
          key: |
            ${{ runner.os }}-vcpkg-v2024.12.01-${{ hashFiles('vcpkg.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-v2024.12.01-
            ${{ runner.os }}-vcpkg-
      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $desiredVersion = "2024.12.01"
          if (Test-Path $Env:VCPKG_ROOT) {
            if (-not (Test-Path (Join-Path $Env:VCPKG_ROOT '.git'))) {
              Remove-Item $Env:VCPKG_ROOT -Recurse -Force
            }
          }
          if (-not (Test-Path $Env:VCPKG_ROOT)) {
            Write-Host "Cloning vcpkg version $desiredVersion..."
            git clone --depth 1 --branch $desiredVersion https://github.com/microsoft/vcpkg.git $Env:VCPKG_ROOT
          } else {
            Write-Host "Checking vcpkg version..."
            cd $Env:VCPKG_ROOT
            $currentTag = git describe --tags --abbrev=0 2>$null
            if ($currentTag -ne "v$desiredVersion") {
              Write-Host "Updating vcpkg from $currentTag to v$desiredVersion..."
              git fetch --depth 1 origin tag "v$desiredVersion"
              git checkout "v$desiredVersion"
            }
          }
          & (Join-Path $Env:VCPKG_ROOT 'bootstrap-vcpkg.bat')
          Write-Host "vcpkg version: $(& $Env:VCPKG_ROOT\vcpkg.exe version)"
      - name: Install vcpkg dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $Env:VCPKG_ROOT)) {
            throw "VCPKG_ROOT is not initialized"
          }
          $manifestFile = Join-Path $Env:GITHUB_WORKSPACE 'vcpkg.json'
          if (-not (Test-Path $manifestFile)) {
            throw "vcpkg.json not found: $manifestFile"
          }
          Write-Host "Installing dependencies with manifest mode..."
          & "$Env:VCPKG_ROOT\vcpkg.exe" install --triplet x64-windows --x-manifest-root=$Env:GITHUB_WORKSPACE --recurse
          Write-Host "Installed packages:"
          & "$Env:VCPKG_ROOT\vcpkg.exe" list
      - name: Configure
        run: cmake -S . -B build -DENABLE_SIGNAL_SPIKE=ON -DBUILD_SERVER=OFF
      - name: Build
        run: cmake --build build --target test_signal_spike --config Release
      - name: Run
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          ./build/Release/test_signal_spike.exe | Tee-Object -FilePath spike.log
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Spike run failed: exit code $LASTEXITCODE" -ErrorAction Stop
          }
          $logContent = Get-Content -Path spike.log -Raw
          if ($logContent -notlike "*Signal E2E Loop OK*") {
            Write-Error "Spike run failed: expected log message not found" -ErrorAction Stop
          }


