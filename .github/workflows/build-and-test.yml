name: Build and Test

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
  workflow_dispatch:

jobs:
  cross-platform:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            pip-cache: ~/.cache/pip
          - name: macOS
            os: macos-latest
            pip-cache: ~/Library/Caches/pip
          - name: Windows
            os: windows-latest
            pip-cache: ~\AppData\Local\pip\Cache

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ${{ matrix.pip-cache }}
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml', 'requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install system dependencies (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libargon2-dev netcat-openbsd lcov clang-format cppcheck protobuf-c-compiler libprotobuf-c-dev

      - name: Install Homebrew dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          brew update
          brew install cmake argon2 openssl@3 sqlite3 lcov protobuf-c

      - name: Configure macOS build environment
        if: matrix.os == 'macos-latest'
        run: |
          OPENSSL_PREFIX=$(brew --prefix openssl@3)
          ARGON2_PREFIX=$(brew --prefix argon2)
          echo "OPENSSL_ROOT_DIR=${OPENSSL_PREFIX}" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L${OPENSSL_PREFIX}/lib -L${ARGON2_PREFIX}/lib" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I${OPENSSL_PREFIX}/include -I${ARGON2_PREFIX}/include" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${OPENSSL_PREFIX}/lib/pkgconfig:${ARGON2_PREFIX}/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"

      - name: Set up MSVC developer command prompt
        if: matrix.os == 'windows-latest'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure vcpkg root (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $customRoot = Join-Path $Env:RUNNER_TEMP 'vcpkg'
          $binaryCache = Join-Path $Env:RUNNER_TEMP 'vcpkg-binary-cache'
          if (-not (Test-Path $binaryCache)) {
            New-Item -ItemType Directory -Path $binaryCache | Out-Null
          }
          Add-Content -Path $Env:GITHUB_ENV -Value "VCPKG_ROOT=$customRoot"
          Add-Content -Path $Env:GITHUB_ENV -Value ("CMAKE_TOOLCHAIN_FILE={0}" -f (Join-Path $customRoot 'scripts/buildsystems/vcpkg.cmake'))
          Add-Content -Path $Env:GITHUB_ENV -Value "VCPKG_TARGET_TRIPLET=x64-windows"
          Add-Content -Path $Env:GITHUB_ENV -Value "VCPKG_DEFAULT_BINARY_CACHE=$binaryCache"
          Add-Content -Path $Env:GITHUB_ENV -Value "VCPKG_BINARY_SOURCES=clear;files,$binaryCache,readwrite"

      - name: Restore vcpkg cache (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.VCPKG_ROOT }}
            ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: |
            ${{ runner.os }}-vcpkg-v2024.12.01-${{ hashFiles('.github/workflows/build-and-test.yml', '.github/vcpkg-windows-ports.txt') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-v2024.12.01-
            ${{ runner.os }}-vcpkg-

      - name: Bootstrap vcpkg (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $desiredVersion = "master"  # 使用存在的master分支
          
          if (Test-Path $Env:VCPKG_ROOT) {
            if (-not (Test-Path (Join-Path $Env:VCPKG_ROOT '.git'))) {
              Remove-Item $Env:VCPKG_ROOT -Recurse -Force
            }
          }
          
          if (-not (Test-Path $Env:VCPKG_ROOT)) {
            Write-Host "Cloning vcpkg version $desiredVersion..."
            git clone --depth 1 --branch $desiredVersion https://github.com/microsoft/vcpkg.git $Env:VCPKG_ROOT
          } else {
            Write-Host "Checking vcpkg version..."
            cd $Env:VCPKG_ROOT
            $currentTag = git describe --tags --abbrev=0 2>$null
            if ($currentTag -ne "v$desiredVersion") {
              Write-Host "Updating vcpkg from $currentTag to v$desiredVersion..."
              git fetch --depth 1 origin tag "v$desiredVersion"
              git checkout "v$desiredVersion"
            }
          }
          
          & (Join-Path $Env:VCPKG_ROOT 'bootstrap-vcpkg.bat')
          Write-Host "vcpkg version: $(& $Env:VCPKG_ROOT\vcpkg.exe version)"

      - name: Install vcpkg dependencies (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not (Test-Path $Env:VCPKG_ROOT)) {
            throw "VCPKG_ROOT is not initialized"
          }
          $portsFile = Join-Path $Env:GITHUB_WORKSPACE '.github/vcpkg-windows-ports.txt'
          if (-not (Test-Path $portsFile)) {
            throw "vcpkg ports list not found: $portsFile"
          }
          $ports = Get-Content $portsFile | Where-Object { $_ -and -not $_.StartsWith('#') }
          if (-not $ports) {
            throw "vcpkg ports list is empty"
          }
          
          Write-Host "Installing dependencies with parallel builds..."
          $env:VCPKG_FEATURE_FLAGS = 'binarycaching'
          $env:VCPKG_BINARY_SOURCES = $Env:VCPKG_BINARY_SOURCES
          
          # Use parallel builds with optimized settings
          & "$Env:VCPKG_ROOT\vcpkg.exe" install $ports --triplet x64-windows --x-manifest-root=$Env:GITHUB_WORKSPACE --recurse --verbose
          
          Write-Host "Installed packages:"
          & "$Env:VCPKG_ROOT\vcpkg.exe" list

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-dev.txt
          python -m pip install ".[gui]" build coverage

      - name: Validate Python package metadata
        run: |
          python -m build --sdist --wheel --outdir dist/tmp

      - name: Run Ruff static analysis
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m ruff check src/ tests/

      - name: Run Python unit tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -m "not integration" tests/python

      - name: Run coverage and integration suite
        shell: bash
        env:
          RUNNER_OS: ${{ runner.os }}
        run: |
          set -euo pipefail
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            export PATH="/c/Program Files/CMake/bin:$PATH"
          fi
          bash scripts/run_coverage.sh

      - name: Smoke Test M-Proto-v2 Handler
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          DRLMS_ENABLE_MPROTO_V2: "1"
          SMOKE_HOST: 127.0.0.1
          SMOKE_PORT: 19090
        run: |
          set -euo pipefail
          # Use coverage build dir from previous step
          BIN_DIR="${GITHUB_WORKSPACE}/build/coverage"
          # Find server executable robustly
          find_server() {
            local root="$1"
            local -a candidates=(
              "${root}/log_collector_server"
              "${root}/RelWithDebInfo/log_collector_server"
              "${root}/Debug/log_collector_server"
              "${root}/Release/log_collector_server"
            )
            for c in "${candidates[@]}"; do
              if [[ -x "$c" ]]; then echo "$c"; return 0; fi
            done
            return 1
          }
          SERVER=$(find_server "${BIN_DIR}") || { echo "[error] server not found"; exit 1; }
          echo "Using server: ${SERVER}"
          # Launch server in background, capture stdout/stderr
          : > mp2_server.out
          : > mp2_server.err
          ( env DRLMS_ENABLE_MPROTO_V2=1 DRLMS_PORT="${SMOKE_PORT}" "${SERVER}" > mp2_server.out 2> mp2_server.err & echo $! > mp2_server.pid )
          # Wait for server readiness
          tries=50
          until nc -z "${SMOKE_HOST}" "${SMOKE_PORT}" >/dev/null 2>&1; do
            tries=$((tries-1))
            if [[ ${tries} -le 0 ]]; then
              echo "[error] server did not become ready"; cat mp2_server.out mp2_server.err || true; exit 1
            fi
            sleep 0.1
          done
          # Send a valid AUTH_CHALLENGE_REQUEST (msg_type=100)
          python3 scripts/smoke_mp2_client.py --host "${SMOKE_HOST}" --port "${SMOKE_PORT}" --type 100 || true
          sleep 0.2
          if ! (grep -q "Received MSG_TYPE_AUTH_CHALLENGE_REQUEST" mp2_server.err || grep -q "Received MSG_TYPE_AUTH_CHALLENGE_REQUEST" mp2_server.out); then
            echo "[error] stub log not observed for valid frame"; cat mp2_server.out mp2_server.err; exit 1
          fi
          # Optional: send bad magic and ensure no crash
          before_lines=$(wc -l < mp2_server.err || echo 0)
          python3 scripts/smoke_mp2_client.py --host "${SMOKE_HOST}" --port "${SMOKE_PORT}" --type 100 --bad-magic || true
          sleep 0.2
          after_lines=$(wc -l < mp2_server.err || echo 0)
          if [[ -z "${after_lines}" || -z "${before_lines}" ]]; then after_lines=0; before_lines=0; fi
          if ! ps -p $(cat mp2_server.pid) >/dev/null 2>&1; then
            echo "[error] server crashed on bad magic"; cat mp2_server.out mp2_server.err; exit 1
          fi
          # Teardown
          kill -TERM $(cat mp2_server.pid) >/dev/null 2>&1 || true
          sleep 0.2
          pkill -f log_collector_server >/dev/null 2>&1 || true

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.name }}
          path: coverage/
          if-no-files-found: ignore
