syntax = "proto3";
package mingdrlms.v2;

// 端到端密钥生成请求
message E2EEGenerateKeysRequest {
  string user_name = 1;
  bool force_regenerate = 2;
}

message E2EEGenerateKeysResponse {
  int32 code = 1;
  string message = 2;
  uint32 registration_id = 3;
  uint32 pre_key_count = 4;
  SignalKeyPair identity_key = 5;
  uint32 device_id = 6;
  repeated SignalPreKey pre_keys = 7;
  SignalSignedPreKey signed_pre_key = 8;
}

// 端到端预密钥包请求
message E2EEPreKeyBundleRequest {
  string user_name = 1;
}

message E2EEPreKeyBundleResponse {
  int32 code = 1;
  string message = 2;
  bytes identity_key = 3;
  uint32 registration_id = 4;
  uint32 device_id = 5;
  uint32 pre_key_id = 6;
  bytes pre_key_public = 7;
  uint32 signed_pre_key_id = 8;
  bytes signed_pre_key_public = 9;
  bytes signed_pre_key_signature = 10;
}

message SignalKeyPair {
  bytes public_key = 1;
  bytes private_key = 2;
}

message SignalPreKey {
  uint32 id = 1;
  SignalKeyPair key = 2;
}

message SignalSignedPreKey {
  uint32 id = 1;
  SignalKeyPair key = 2;
  bytes signature = 3;
  uint64 timestamp = 4;
}

message SignalSenderKeyDistribution {
  string room_name = 1;
  string group_id = 2;
  string sender = 3;
  uint32 sender_device_id = 4;
  uint32 sender_registration_id = 5;
  bytes distribution_message = 6;
  uint32 sender_key_id = 7;
  uint32 sender_key_iteration = 8;
}

message E2EESenderKeyPushRequest {
  string access_token = 1;
  string target_user = 2;
  SignalSenderKeyDistribution distribution = 3;
}

message E2EESenderKeyPushResponse {
  int32 code = 1;
  string message = 2;
}
