syntax = "proto3";
package mingdrlms.v2;

// 消息类型枚举 (对应 MProtoHeader.msg_type)
enum MessageType {
  MSG_TYPE_UNKNOWN = 0;

  // 认证 (100-199)
  MSG_TYPE_AUTH_CHALLENGE_REQUEST = 100;
  MSG_TYPE_AUTH_CHALLENGE_RESPONSE = 101;
  MSG_TYPE_AUTH_REQUEST = 102;
  MSG_TYPE_AUTH_RESPONSE = 103;

  // 端到端密钥 (500-599)
  MSG_TYPE_E2EE_GENERATE_KEYS_REQUEST = 500;
  MSG_TYPE_E2EE_GENERATE_KEYS_RESPONSE = 501;
  MSG_TYPE_E2EE_PREKEY_BUNDLE_REQUEST = 502;
  MSG_TYPE_E2EE_PREKEY_BUNDLE_RESPONSE = 503;
  MSG_TYPE_E2EE_SENDER_KEY_PUSH = 504;
  MSG_TYPE_REFRESH_TOKEN_REQUEST = 104;
  MSG_TYPE_REFRESH_TOKEN_RESPONSE = 105;

  // 房间 (200-299)
  MSG_TYPE_ROOM_SUB_REQUEST = 200;
  MSG_TYPE_ROOM_PUB_REQUEST = 201;
  MSG_TYPE_ROOM_EVENT = 202;
  MSG_TYPE_ROOM_INFO_REQUEST = 210;
  MSG_TYPE_ROOM_INFO_RESPONSE = 211;
  MSG_TYPE_ROOM_LIST_REQUEST = 212;
  MSG_TYPE_ROOM_LIST_RESPONSE = 213;
  MSG_TYPE_ROOM_CREATE_REQUEST = 214;
  MSG_TYPE_ROOM_CREATE_RESPONSE = 215;
  MSG_TYPE_ROOM_SET_POLICY_REQUEST = 216;
  MSG_TYPE_ROOM_SET_POLICY_RESPONSE = 217;
  MSG_TYPE_ROOM_SET_STORAGE_POLICY_REQUEST = 218;
  MSG_TYPE_ROOM_SET_STORAGE_POLICY_RESPONSE = 219;
  MSG_TYPE_ROOM_TRANSFER_REQUEST = 220;
  MSG_TYPE_ROOM_TRANSFER_RESPONSE = 221;
  MSG_TYPE_ROOM_HISTORY_REQUEST = 222;
  MSG_TYPE_ROOM_HISTORY_CHUNK = 223;
  MSG_TYPE_ROOM_HISTORY_DONE = 224;
  MSG_TYPE_ROOM_FILE_PUB_BEGIN = 225;
  MSG_TYPE_ROOM_FILE_PUB_CHUNK = 226;
  MSG_TYPE_ROOM_FILE_PUB_COMMIT = 227;
  MSG_TYPE_ROOM_FILE_PUB_RESULT = 228;
  MSG_TYPE_ROOM_FILE_DOWNLOAD_REQUEST = 229;
  MSG_TYPE_ROOM_FILE_DOWNLOAD_CHUNK = 230;
  MSG_TYPE_ROOM_FILE_DOWNLOAD_DONE = 231;
  MSG_TYPE_ROOM_MEMBER_LIST_REQUEST = 232;
  MSG_TYPE_ROOM_MEMBER_LIST_RESPONSE = 233;

  // 联邦 (300-399)
  MSG_TYPE_S2S_PUB_REQUEST = 300;
  MSG_TYPE_S2S_PUB_RESPONSE = 301;
  MSG_TYPE_S2S_SUB_REQUEST = 302;
  MSG_TYPE_S2S_SUB_RESPONSE = 303;

  // 通用错误 (400-499)
  MSG_TYPE_ERROR_RESPONSE = 400;
}

// 通用错误响应
message ErrorResponse {
  int32 code = 1;
  string message = 2;
}


