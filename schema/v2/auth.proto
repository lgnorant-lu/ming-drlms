syntax = "proto3";
package mingdrlms.v2;

// 阶段 1: 挑战
message AuthChallengeRequest {
  string username = 1;
}

message AuthChallengeResponse {
  string nonce = 1; // 服务器发送的挑战
  string server_salt = 2; // 可选：服务端提供的域分隔盐，用于签名绑定
}

// 阶段 2: 认证
message AuthRequest {
  string username = 1;
  string response = 2; // H(password_hash + nonce)
  ClientInfo client = 3; // 可选：客户端设备与签名身份信息
}

message AuthResponse {
  string access_token = 1;  // 短期 JWT
  string refresh_token = 2; // 长期 Opaque
  int64 access_token_expires_in = 3; // (秒)
  int32 accepted_device_id = 4; // 可选：服务端确认的设备号
  bool recorded_identity = 5;   // 可选：服务端是否已记录/更新签名身份
}

// 签名类型枚举 (Phase 15.5+)
// 注意：数值 0 保留给历史 Ed25519，当前实现仅接受 XEdDSA。
enum SignatureType {
  SIG_TYPE_ED25519 = 0;   // legacy/reserved: Phase 15.5+ 不应再使用
  SIG_TYPE_XEDDSA = 1;    // 现行：XEdDSA 签名 (X25519 + EdDSA, Phase 15.5+)
}

// 客户端设备与签名身份提示（可选）
message ClientInfo {
  int32 device_id = 1;                // 设备ID（本地生成/持久化）
  int32 registration_id = 2;          // Signal Registration ID
  bytes identity_pubkey = 3;          // 公钥（32字节）：XEdDSA=X25519（Phase 15.5+）
  bytes identity_sig = 4;             // 签名（64字节）
  int64 sig_ts = 5;                   // 客户端签名时间戳（秒）
  string device_guid = 6;             // 可选：设备GUID/硬件指纹
  string platform = 7;                // 可选：平台标识（windows/linux/darwin等）
  string app_version = 8;             // 可选：应用版本
  uint64 capabilities = 9;            // 可选：能力位
  bytes prev_identity_pubkey = 10;    // 可选：轮换前公钥
  bytes rotation_proof = 11;          // 可选：轮换证明（前后密钥相互签名）
  SignatureType signature_type = 12;  // 签名类型：0=Ed25519(legacy, reserved), 1=XEdDSA
}

// 阶段 4: 刷新
message RefreshTokenRequest {
  string refresh_token = 1;
}

message RefreshTokenResponse {
  string access_token = 1;
  int64 access_token_expires_in = 2;
}


