# =============================================================================
# DRLMS 配置文件
# =============================================================================
# 位置：
#   Windows: %APPDATA%\DRLMS\config.toml
#   Linux:   ~/.drlms/config.toml
#
# 优先级：环境变量 > config.toml > 默认值
# =============================================================================

# =============================================================================
# 通用设置
# =============================================================================
[general]
# 界面语言: "en", "zh"
language = "zh"

# 启动时检查更新
update_check = true

# =============================================================================
# 压缩设置 (Phase 23)
# =============================================================================
[compression]
# 文件传输压缩开关
# true = 开启 (智能压缩: MIME检测 + 大小阈值)
# false = 关闭 (总是传输原始内容)
enabled = true

# 最小压缩阈值 (字节)
# 小于此大小的文件不进行压缩
min_size = 128

# 最小压缩收益率 (0.0 - 1.0)
# 若压缩后大小 > 原大小 * (1 - ratio)，则放弃压缩使用原文件
# 默认 0.1 (至少节省 10% 空间)
min_ratio = 0.1

# =============================================================================
# 后端配置
# =============================================================================
[backend]
# 后端模式：
#   - "relay": 去中心化 Relay 模式（推荐）
#   - "mp2": 传统 MP2 服务器模式
#   - "hybrid": 房间级别模式选择
mode = "relay"

# --- Relay 配置 ---
[backend.relay]
# Relay 服务器地址（数组或逗号分隔字符串）
# 示例：
#   urls = ["http://localhost:15019"]
#   urls = ["http://relay1.example.com", "http://relay2.example.com"]
urls = ["http://localhost:15019"]

# 高级：多 Relay 详细配置文件路径（relays.toml）
# config_file = ""

# --- MP2 服务器配置 ---
[backend.mp2]
# MP2 服务器地址
host = "127.0.0.1"

# MP2 服务器端口
port = 15035

# 启用 TLS 加密连接
tls = false

# =============================================================================
# 身份配置
# =============================================================================
[identity]
# 当前用户名（用于 LocalKeyStore 身份查找）
# 许多 CLI 命令需要此配置
user = ""

# 设备 ID（多设备支持）
device_id = 1

# 注册 ID（未设置则自动生成）
# registration_id = 0

# --- BIP39 助记词身份 (Phase 27) ---
# 从 BIP39 助记词派生身份，确保跨设备一致性
# 留空则使用随机生成的密钥
# mnemonic = "abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon abandon about"
# passphrase = ""

# =============================================================================
# PQC 后量子加密 (Phase 27)
# =============================================================================
[pqc]
# 启用后量子加密（需要 liboqs 库）
# true = 使用混合加密 (X25519 + ML-KEM-768)
# false = 仅使用经典加密 (X25519)
enabled = true

# PQC 算法选择
# "ML-KEM-768" (推荐, NIST Level 3)
# "ML-KEM-1024" (最高安全, NIST Level 5)
algorithm = "ML-KEM-768"

# liboqs 库路径（可选）
# 留空则自动检测 (从 PATH 或 LIBOQS_DIR 环境变量)
# Windows 示例: "C:\\liboqs\\bin\\oqs.dll"
# Linux 示例: "/usr/local/lib/liboqs.so"
# liboqs_path = ""

# =============================================================================
# 信任策略
# =============================================================================
[trust]
# 新联系人默认信任策略：
#   - "tofu": 首次信任（默认，便捷）
#   - "manual_only": 仅手动验证（高安全）
#   - "anchored_only": 仅外部锚定（最高安全）
default_policy = "tofu"

# 联系人公钥变更时的行为：
#   - "warn": 显示警告，让用户决定（默认）
#   - "block": 自动阻止直到手动验证
#   - "reset": 重置信任级别到 TOFU
key_change_action = "warn"

# =============================================================================
# Keyserver 配置
# =============================================================================
[keyserver]
# 查询超时（秒）
timeout = 5.0

# OPK（一次性预密钥）最小数量，低于此值触发补充
min_opk_count = 10

# 补充后目标 OPK 数量
target_opk_count = 100

# =============================================================================
# 房间默认设置
# =============================================================================
[rooms]
# 新房间默认可见性: "private", "unlisted", "public"
default_visibility = "private"

# 房间公告频道
announcement_channel = "__rooms__"

# =============================================================================
# TUI 界面设置
# =============================================================================
[tui]
# 主题: "forest"（默认）, "cyberpunk"
theme = "forest"

# 文件选择器根目录：
#   - "": 当前工作目录（默认）
#   - "~/Documents/DRLMS": 主目录子文件夹
#   - "/absolute/path": 绝对路径
file_picker_root = ""

# 自定义主题颜色（可选）
[tui.custom_colors]
# 格式: color_name = "#RRGGBB"
# 可用键: primary, secondary, accent, background, surface, text
# 示例:
# primary = "#b8bb26"
# background = "#1d2021"

# =============================================================================
# 日志配置
# =============================================================================
[logging]
# 日志级别: "DEBUG", "INFO", "WARNING", "ERROR"
level = "INFO"

# 日志目录（留空使用默认: ~/.drlms/logs 或 %APPDATA%\DRLMS\logs）
dir = ""

# 控制台输出
console = true

# JSON 格式日志（生成 .jsonl 文件）
json = false

# 日志轮转模式: "size"（按大小）, "time"（按天）
rotate = "size"

# 保留日志文件数量
keep = 5

# 单文件最大大小（MB，按大小轮转时生效）
max_mb = 10

# =============================================================================
# 路径配置（高级）
# =============================================================================
[paths]
# 数据目录覆盖（日志、数据库等）
# 默认: Windows: %LOCALAPPDATA%\drlms, Linux: ~/.local/share/drlms
# data_dir = ""

# 配置目录覆盖（通常不需要设置）
# 默认: Windows: %APPDATA%\DRLMS, Linux: ~/.drlms
# config_dir = ""
